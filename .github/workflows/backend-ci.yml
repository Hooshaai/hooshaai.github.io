name: 🐍 Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: 'django-insecure-ci-test-key-!@#$%^&*()_+'
  DJANGO_DEBUG: 'True'
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    name: 🧪 Django Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run System Check
        run: python manage.py check

      - name: Run Migrations
        run: python manage.py migrate --run-syncdb

      - name: Run Test Suite
        run: |
          python manage.py test --verbosity=2 2>&1 | tee test_output.txt
          if grep -q "FAILED" test_output.txt; then
            echo "❌ Tests FAILED"
            exit 1
          fi

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Django Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linters
        run: pip install flake8

      - name: Run Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=migrations,__pycache__,.venv,venv
          echo "✅ No critical Python errors found"

  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t hoosha-backend:test . || {
            echo "⚠️  Docker build failed — check Dockerfile"
            exit 1
          }
          echo "✅ Docker image built successfully"
