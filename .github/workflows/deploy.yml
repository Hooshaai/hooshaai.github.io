name: 🚀 Deploy Hoosha AI React Website

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'backend/**'
      - 'mobile_app/**'
      - '.github/workflows/sync-substack.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Validate React Build & Assets
  # ─────────────────────────────────────────
  validate:
    name: 🔍 Validate React SPA & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Root React Bundle Exists
        run: |
          echo "🔍 Checking Root React SPA Bundle..."
          for f in index.html .nojekyll; do
            if [ -f "$f" ]; then
              echo "  ✅ $f ($(wc -c < "$f") bytes)"
            else
              echo "  ❌ MISSING: $f"
              exit 1
            fi
          done

          if [ -d "assets" ]; then
            echo "  ✅ assets/ directory present ($(ls assets | wc -l) files)"
          else
            echo "  ❌ MISSING: assets/ directory"
            exit 1
          fi

      - name: Validate Root HTML
        run: |
          python3 -c "
          import sys
          with open('index.html') as f:
              content = f.read()
          if '<!DOCTYPE html>' not in content or '<div id=\"root\">' not in content:
              print('❌ index.html is missing DOCTYPE or React root element!')
              sys.exit(1)
          print('✅ Root index.html is a valid React SPA entrypoint!')
          "

  # ─────────────────────────────────────────
  # JOB 2: Deploy React SPA to GitHub Pages
  # ─────────────────────────────────────────
  deploy:
    name: 🌐 Deploy React SPA to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post Deployment Summary
        run: |
          echo "## 🚀 React SPA Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live Website:** [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚛️ React SPA Routes" >> $GITHUB_STEP_SUMMARY
          echo "| Route | Feature |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏠 Home | Hero, Neural Canvas, Counter Stats, Tech Marquee |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 Research | 20 Dispatches, Web Audio TTS Player, KaTeX Math |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Ecosystem | 4-Layer Architecture Stack Explorer, Brand Cards |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Models | Model Vault, Checkpoint Download Simulator |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Labs | CFM 2D Solver, GRPO Policy, DiffAttn, RAG Probe |" >> $GITHUB_STEP_SUMMARY
          echo "| 💻 Platform | 8x H100 GPU Matrix, Triton JIT Playground, Recharts |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Admin | Executive Control, Subscriber Search, API Key Toast |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 3: Create GitHub Release (on version tags)
  # ─────────────────────────────────────────
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package React SPA Site
        run: |
          zip -r hoosha-react-spa-${{ github.ref_name }}.zip \
            index.html .nojekyll assets/ react_app/ \
            --exclude "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Hoosha AI React SPA ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## ⚛️ Hoosha AI Full React SPA Release ${{ github.ref_name }}

            ### 🌐 Live Website
            **https://hooshaai.github.io**
          files: hoosha-react-spa-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
