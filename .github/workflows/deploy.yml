name: 🚀 Deploy Hoosha AI Website

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'backend/**'
      - 'mobile_app/**'
      - '.github/workflows/sync-substack.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: false
        default: 'production'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Validate & Lint
  # ─────────────────────────────────────────
  validate:
    name: 🔍 Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required Files Exist
        run: |
          echo "🔍 Checking required HTML pages..."
          for f in index.html research.html ecosystem.html models.html labs.html platform.html admin.html style.css script.js; do
            if [ -f "$f" ]; then
              echo "  ✅ $f ($(wc -c < "$f") bytes)"
            else
              echo "  ❌ MISSING: $f"
              exit 1
            fi
          done

          echo ""
          echo "🔍 Checking assets & data..."
          for f in articles.json data.json .nojekyll; do
            if [ -f "$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ⚠️  Optional file missing: $f"
            fi
          done

      - name: Validate HTML Structure
        run: |
          python3 -c "
          import re, sys, os

          pages = ['index.html','research.html','ecosystem.html','models.html','labs.html','platform.html','admin.html']
          errors = []

          for page in pages:
              with open(page, 'r', encoding='utf-8') as f:
                  content = f.read()

              if '<!DOCTYPE html>' not in content:
                  errors.append(f'{page}: Missing DOCTYPE')
              if '<html' not in content:
                  errors.append(f'{page}: Missing <html> tag')
              if '<head>' not in content and '<head ' not in content:
                  errors.append(f'{page}: Missing <head>')
              if '</body>' not in content:
                  errors.append(f'{page}: Missing </body>')
              if '<title>' not in content:
                  errors.append(f'{page}: Missing <title>')
              if 'style.css' not in content:
                  errors.append(f'{page}: Not linked to style.css')

              size_kb = os.path.getsize(page) / 1024
              print(f'  ✅ {page} ({size_kb:.1f} KB)')

          if errors:
              print()
              print('❌ HTML Validation Errors:')
              for e in errors:
                  print(f'   {e}')
              sys.exit(1)
          else:
              print()
              print('✅ All HTML pages validated successfully!')
          "

      - name: Validate JSON Data Files
        run: |
          python3 -c "
          import json, sys

          files = ['articles.json', 'data.json']
          for f in files:
              try:
                  with open(f) as fh:
                      data = json.load(fh)
                  print(f'  ✅ {f} — valid JSON')
              except FileNotFoundError:
                  print(f'  ⚠️  {f} not found (will be generated by sync)')
              except json.JSONDecodeError as e:
                  print(f'  ❌ {f} — invalid JSON: {e}')
                  sys.exit(1)
          print('✅ JSON data files OK')
          "

      - name: Check JavaScript Syntax
        run: |
          node --check script.js && echo "✅ script.js syntax OK" || exit 1

      - name: Generate Build Report
        run: |
          echo "## 📊 Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in index.html research.html ecosystem.html models.html labs.html platform.html admin.html style.css script.js; do
            size=$(du -sh "$f" 2>/dev/null | cut -f1)
            echo "| \`$f\` | $size |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 2: Deploy to GitHub Pages
  # ─────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Pages Deployed" >> $GITHUB_STEP_SUMMARY
          echo "| Page | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏠 Home | [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 Research Journal | [${{ steps.deployment.outputs.page_url }}research.html](${{ steps.deployment.outputs.page_url }}research.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Ecosystem | [${{ steps.deployment.outputs.page_url }}ecosystem.html](${{ steps.deployment.outputs.page_url }}ecosystem.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Model Zoo | [${{ steps.deployment.outputs.page_url }}models.html](${{ steps.deployment.outputs.page_url }}models.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 AI Labs | [${{ steps.deployment.outputs.page_url }}labs.html](${{ steps.deployment.outputs.page_url }}labs.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 💻 Platform | [${{ steps.deployment.outputs.page_url }}platform.html](${{ steps.deployment.outputs.page_url }}platform.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Admin | [${{ steps.deployment.outputs.page_url }}admin.html](${{ steps.deployment.outputs.page_url }}admin.html) |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 3: Create GitHub Release (on version tags)
  # ─────────────────────────────────────────
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package Static Site
        run: |
          zip -r hoosha-ai-website-${{ github.ref_name }}.zip \
            index.html research.html ecosystem.html models.html labs.html \
            platform.html admin.html style.css script.js \
            articles.json data.json .nojekyll \
            assets/ \
            --exclude "*.DS_Store" \
            --exclude "*/__pycache__/*"

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)")
          else
            CHANGES=$(git log --oneline -20 --pretty=format:"- %s (%h)")
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Hoosha AI Website ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🧠 Hoosha AI Research Website ${{ github.ref_name }}

            ### 🚀 What's New
            ${{ steps.changelog.outputs.CHANGES }}

            ### 🌐 Live at
            **https://hooshaai.github.io**

            ### 📄 Pages
            | Page | Description |
            |------|-------------|
            | [Home](https://hooshaai.github.io) | Landing page with neural canvas |
            | [Research Journal](https://hooshaai.github.io/research.html) | 20 Substack articles + TTS podcast |
            | [Ecosystem](https://hooshaai.github.io/ecosystem.html) | Tech stack & affiliations |
            | [Model Zoo](https://hooshaai.github.io/models.html) | .safetensors checkpoint vault |
            | [AI Labs](https://hooshaai.github.io/labs.html) | Interactive AI simulations |
            | [Platform](https://hooshaai.github.io/platform.html) | CUDA playground & GPU telemetry |
            | [Admin](https://hooshaai.github.io/admin.html) | Executive control center |

            ### 📦 Downloads
            - `hoosha-ai-website-${{ github.ref_name }}.zip` — Complete static site bundle
          files: hoosha-ai-website-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
