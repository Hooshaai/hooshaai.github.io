name: 🔄 Sync Substack Articles

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

concurrency:
  group: sync-substack
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    name: 📰 Fetch & Sync Substack RSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch & Parse Substack RSS Feed
        run: |
          python3 - <<'PYEOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          import html
          from datetime import datetime, timezone

          FEED_URL = 'https://hooshaai.substack.com/feed'
          CATEGORY_MAP = {
            'linear': 'linear-attention',
            'attention': 'linear-attention',
            'transformer': 'linear-attention',
            'grpo': 'cognition',
            'rlhf': 'cognition',
            'reasoning': 'cognition',
            'cogniti': 'cognition',
            'scaling': 'cognition',
            'verif': 'verification',
            'epistemic': 'verification',
            'causal': 'verification',
            'hallucin': 'verification',
            'conscious': 'consciousness',
            'synthetic': 'consciousness',
          }

          def guess_category(title, desc):
            combined = (title + ' ' + desc).lower()
            for kw, cat in CATEGORY_MAP.items():
                if kw in combined:
                    return cat
            return 'consciousness'

          def strip_html(text):
            text = re.sub(r'<[^>]+>', ' ', text)
            text = html.unescape(text)
            text = re.sub(r'\s+', ' ', text).strip()
            return text

          def estimate_read(word_count):
            minutes = max(1, round(word_count / 200))
            return f"{minutes} min read"

          req = urllib.request.Request(FEED_URL, headers={'User-Agent': 'Mozilla/5.0'})
          try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                xml_data = resp.read()
            root = ET.fromstring(xml_data)
            channel = root.find('channel')
            items = channel.findall('item') if channel else []

            articles = []
            for i, item in enumerate(items):
                title = strip_html(item.findtext('title', ''))
                link  = item.findtext('link', '').strip()
                pub   = item.findtext('pubDate', '').strip()
                desc  = strip_html(item.findtext('description', '') or item.findtext('{http://purl.org/rss/1.0/modules/content/}encoded', ''))

                words = len(desc.split())
                snippet = desc[:280] + '...' if len(desc) > 280 else desc
                cat = guess_category(title, desc)

                articles.append({
                    'id': f'art-rss-{i+1}',
                    'title': title,
                    'link': link,
                    'pubDate': pub,
                    'wordCount': f'{words:,} words',
                    'readTime': estimate_read(words),
                    'snippet': snippet,
                    'category': cat,
                    'categoryName': cat.replace('-', ' ').title(),
                    'katex': True,
                    'author': 'Mohammad Taha Majlesi',
                    'authorRole': 'Co-Founder & Lead AI Architect @ Hoosha AI'
                })

            output = {
                'last_updated': datetime.now(timezone.utc).isoformat(),
                'feed_url': FEED_URL,
                'count': len(articles),
                'articles': articles
            }

            with open('articles.json', 'w', encoding='utf-8') as f:
                json.dump(output, f, indent=2, ensure_ascii=False)

            # Also write data.json for backward compat
            with open('data.json', 'w', encoding='utf-8') as f:
                json.dump(output, f, indent=2, ensure_ascii=False)

            print(f'✅ Synced {len(articles)} Substack articles.')
          except Exception as e:
            print(f'❌ Sync error: {e}')
            raise
          PYEOF

      - name: Commit & Push Updated Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json data.json
          if ! git diff-index --quiet HEAD; then
            COUNT=$(python3 -c "import json; d=json.load(open('articles.json')); print(d['count'])")
            git commit -m "chore: auto-sync $COUNT Substack articles [skip ci]"
            git push
            echo "✅ Pushed updated articles.json ($COUNT articles)"
          else
            echo "ℹ️  No changes to commit — articles.json is up to date."
          fi

      - name: Sync Summary
        run: |
          python3 -c "
          import json
          with open('articles.json') as f:
            d = json.load(f)
          print(f'## 📰 Substack Sync Report')
          print(f'**Articles synced:** {d[\"count\"]}')
          print(f'**Last updated:** {d[\"last_updated\"]}')
          print()
          for a in d['articles'][:5]:
            print(f'- {a[\"title\"]} ({a[\"readTime\"]})')
          " >> $GITHUB_STEP_SUMMARY
