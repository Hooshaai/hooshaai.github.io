name: 📱 Mobile App CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile_app/**'
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: 📦 Validate & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile_app/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Expo Doctor (Pre-flight Check)
        run: npx expo-doctor || echo "⚠️  expo-doctor warnings (non-fatal)"

      - name: Validate app.json
        run: |
          python3 -c "
          import json
          with open('app.json') as f:
            config = json.load(f)
          expo = config.get('expo', {})
          assert expo.get('name'), 'Missing app name'
          assert expo.get('slug'), 'Missing app slug'
          android = expo.get('android', {})
          assert android.get('package'), 'Missing android package'
          print(f'  ✅ App: {expo[\"name\"]}')
          print(f'  ✅ Package: {android[\"package\"]}')
          print(f'  ✅ SDK Version: {expo.get(\"sdkVersion\", \"unknown\")}')
          "

      - name: Generate Mobile Summary
        run: |
          echo "## 📱 Mobile App Validation" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          with open('app.json') as f:
            config = json.load(f)
          expo = config.get('expo', {})
          print(f'**App Name:** {expo.get(\"name\")}')
          print(f'**Package:** {expo.get(\"android\", {}).get(\"package\")}')
          print(f'**SDK Version:** {expo.get(\"sdkVersion\")}')
          " >> $GITHUB_STEP_SUMMARY
