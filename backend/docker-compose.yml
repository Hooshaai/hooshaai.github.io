version: '3.8'

services:
  # PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: hoosha_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hooshadb}
      POSTGRES_USER: ${POSTGRES_USER:-hooshauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hooshapass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hooshauser} -d ${POSTGRES_DB:-hooshadb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Celery Broker Container
  redis:
    image: redis:7-alpine
    container_name: hoosha_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application Server (Gunicorn)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoosha_django_web
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn hoosha_backend.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-hoosha-ai-production-secret-key-change-me}
      - DJANGO_ALLOWED_HOSTS=*
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_DB=${POSTGRES_DB:-hooshadb}
      - POSTGRES_USER=${POSTGRES_USER:-hooshauser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hooshapass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Asynchronous Task Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoosha_celery_worker
    restart: always
    command: celery -A hoosha_backend worker --loglevel=info --concurrency=4
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-hoosha-ai-production-secret-key-change-me}
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_DB=${POSTGRES_DB:-hooshadb}
      - POSTGRES_USER=${POSTGRES_USER:-hooshauser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hooshapass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  # Celery Beat Scheduler (Periodic Tasks)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoosha_celery_beat
    restart: always
    command: celery -A hoosha_backend beat --loglevel=info
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-hoosha-ai-production-secret-key-change-me}
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_DB=${POSTGRES_DB:-hooshadb}
      - POSTGRES_USER=${POSTGRES_USER:-hooshauser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hooshapass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
